name: Build GameInfo

# Закинули GameInfo.zip в корень репозитория -> запускается сборка и публикуется релиз с APK.
on:
  push:
    paths:
      - 'GameInfo.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Распаковка проекта
        run: |
          rm -rf _src
          mkdir _src
          unzip -q GameInfo.zip -d _src

      - name: Сборка release APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: gradle -p _src assembleRelease --no-daemon --stacktrace

      - name: Подготовка APK
        run: cp _src/app/build/outputs/apk/release/app-release.apk GameInfo.apk

      - name: Публикация релиза (из него приложение берёт обновления)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" GameInfo.apk \
            --title "Game Info 1.0.${{ github.run_number }}" \
            --notes "Сборка ${{ github.run_number }}" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: GameInfo-apk
          path: GameInfo.apk
